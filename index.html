<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Soy el amor de tu vida, Belén? 💜</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #8e44ad 0%, #f3e5f5 50%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            text-align: center;
            overflow: hidden;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(142, 68, 173, 0.15);
            transition: all 0.5s ease;
        }
        h1 {
            color: #8e44ad;
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 600;
        }
        .banderas img {
            width: 30px;
            height: auto;
            vertical-align: middle;
            margin: 0 5px;
        }
        .pregunta {
            font-size: 18px;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #555;
            font-weight: 300;
        }
        .botones {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 400;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(142, 68, 173, 0.2);
        }
        .btn-si {
            background: #8e44ad;
            color: white;
        }
        .btn-si:hover {
            transform: scale(1.05);
            background: #7d3c98;
            box-shadow: 0 8px 20px rgba(142, 68, 173, 0.3);
        }
        .btn-no {
            background: #e0e0e0;
            color: #666;
            font-weight: 600;
        }
        .btn-no:hover {
            transform: scale(1.05);
            background: #d0d0d0;
        }
        .mensaje-final {
            display: none;
            margin-top: 20px;
            font-size: 18px;
            color: #8e44ad;
            line-height: 1.6;
            animation: fadeIn 1s ease;
            font-weight: 300;
        }
        .btn-confeti {
            background: #9c27b0;
            color: white;
            margin-top: 20px;
            display: none;
            padding: 12px 25px;
            font-size: 16px;
        }
        .btn-confeti:hover {
            transform: scale(1.05);
            background: #7b1fa2;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Confeti mejorado */
        .confeti {
            position: absolute;
            width: 8px;
            height: 8px;
            pointer-events: none;
            animation: confeti-fall linear infinite;
            border-radius: 50%;
        }
        @keyframes confeti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¡Hola, Belén, mi ratoncito pequeño! <span class="banderas"><img src="https://flagcdn.com/w40/ec.png" alt="🇪🇨">❤️<img src="https://flagcdn.com/w40/ar.png" alt="🇦🇷"></span></h1>
        <div class="pregunta" id="pregunta">¿Soy el amor y el hombre de tu vida?</div>
        <div class="botones">
            <button class="btn-si" onclick="responder('si')" id="btn-si">¡Sí!</button>
            <button class="btn-no" onclick="responder('no')" id="btn-no">No</button>
        </div>
        <div class="mensaje-final" id="mensaje-final"></div>
        <button class="btn-confeti" onclick="lanzarConfeti()" id="btn-confeti">¡Celebremos con confeti! 🎉</button>
    </div>

    <script>
        let clicsNo = 0;
        const maxClicsNo = 10;
        const preguntasNo = [
            "En serio, Belen? ¿No crees que soy el hombre que te hará feliz?",
            "¡Ay, ratoncito! ¿Y si soy el único que te conoce completamente?",
            "No? Milagros Belen Ojeda, ¿ya te olvidaste de que no me iré de vos porque eres mi vida?",
            "¡Dale, mi mujer favorita! ¿No soy el que te hace sentir feliz?",
            "Todavía no? Entonces seguiré instiendo hasta serlo",
            "Última? Nah, ratoncito, ¿de verdad no soy el tipo que te hace sonreír con memes?",
            "¿Sigo insistiendo? Porque extrañé tus ojos y todo tu ser, me hiciste falta",
            "Belen, ¿no? Ok, pero recordá las noches charlando hasta el amanecer",
            "¡Casi me rindo! Pero nah, sos mi debilidad... ¿soy o no soy el hombre que querés de vuelta?",
            "Ya, ratoncito: sin más vueltas, ¿soy el amor que te roba el sueño desde Ecuador?"
        ];

        function responder(respuesta) {
            const preguntaEl = document.getElementById('pregunta');
            const btnNo = document.getElementById('btn-no');
            const mensajeFinal = document.getElementById('mensaje-final');
            const btnConfeti = document.getElementById('btn-confeti');

            if (respuesta === 'si') {
                if (clicsNo >= maxClicsNo) {
                    // Mensaje final más natural
                    mensajeFinal.innerHTML = `¡Sí, Belén! Eres todo para mí, mi ratoncito, el amor de mi vida que me tiene loco desde el primer día. Extraño compartir contigo, tus mensajes locos, amorosos y esa conexión que ni la distancia toca. Me gustaría volver a ser tu pareja y ese hombre. Te quiero un montón, de verdad. 💜 <span class="banderas"><img src="https://flagcdn.com/w40/ec.png" alt="🇪🇨">❤️<img src="https://flagcdn.com/w40/ar.png" alt="🇦🇷"></span>`;
                    mensajeFinal.style.display = 'block';
                    btnConfeti.style.display = 'inline-block';
                    document.querySelector('.botones').style.display = 'none';
                } else {
                    // Si dice sí temprano, un guiño juguetón
                    preguntaEl.textContent = '¡Obvio que sí! Pero si el "No" te tienta, dale... yo espero. 😏';
                }
            } else { // No
                clicsNo++;
                const escala = Math.max(1 - (clicsNo * 0.08), 0); // Más gradual, 10 clics
                btnNo.style.transform = `scale(${escala})`;
                btnNo.style.opacity = Math.max(1 - (clicsNo / maxClicsNo), 0);

                if (clicsNo < maxClicsNo) {
                    preguntaEl.textContent = preguntasNo[clicsNo - 1];
                } else {
                    btnNo.style.display = 'none';
                    preguntaEl.textContent = '¡Listo, ratoncito! Ya no hay salida... solo la verdad queda. 💜';
                }
            }
        }

        function lanzarConfeti() {
            for (let i = 0; i < 150; i++) { // Más confeti para la fiesta
                setTimeout(() => {
                    crearParticula();
                }, i * 8);
            }
        }

        function crearParticula() {
            const particula = document.createElement('div');
            particula.classList.add('confeti');
            const colores = ['#8e44ad', '#9c27b0', '#bb8fce', '#e1bee7']; // Tonos morados
            particula.style.left = Math.random() * 100 + 'vw';
            particula.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
            particula.style.animationDuration = (Math.random() * 3 + 2) + 's';
            particula.style.top = '-10px';
            document.body.appendChild(particula);

            setTimeout(() => {
                if (particula.parentNode) {
                    particula.remove();
                }
            }, 5000);
        }
    </script>
</body>
</html>
